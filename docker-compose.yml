services:
  backend:
    build:
      context: ./backend-app
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /app/data/loglens.db
      JWT_SECRET: ${JWT_SECRET:-replace-this-secret-in-production}
      FRONTEND_ORIGIN: http://localhost:8080
    volumes:
      - loglens-data:/app/data
    expose:
      - "3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  loglens-data:
